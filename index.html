<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Television Shop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top rounded-pill mt-2">

        <div class="container">

            <a class="navbar-brand fw-bold text-primary" href="#">
                Television Shop
            </a>

            <button class="navbar-toggler"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#products">
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Offers
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contact
                        </a>
                    </li>

                </ul>

                <div class="d-flex gap-2 align-items-center" id="authArea">

                    <a href="cart.html"
                       class="btn btn-outline-dark">

                        <i class="fa-solid fa-cart-shopping"></i>

                        <span id="cartCount">
                            0
                        </span>

                    </a>

                    <button
                        class="btn btn-outline-primary"
                        id="loginBtn">

                        Login

                    </button>

                    <button
                        class="btn btn-primary"
                        id="registerBtn">

                        Sign Up

                    </button>

                </div>

            </div>

        </div>

    </nav>

    <!-- ================= HERO ================= -->

    <section class="hero py-5 mt-5">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-lg-6">

                    <h1 class="display-4 fw-bold">

                        Smart TVs For Your Home

                    </h1>

                    <p class="text-muted mt-3">

                        Discover Samsung, Sony and LG Smart TVs
                        with amazing prices.

                    </p>

                    <a href="#products"
                       class="btn btn-primary btn-lg">

                        Shop Now

                    </a>

                </div>

                <div class="col-lg-6 text-center">

                    <img
                    src="https://i.pinimg.com/1200x/56/36/65/56366524f3f4d555795e004bc89d4505.jpg"
                    class="img-fluid hero-img">

                </div>

            </div>

        </div>

    </section>

    <!-- ================= SEARCH ================= -->

    <section class="container mb-4">

        <div class="row">

            <div class="col-md-6 mx-auto">

                <input
                type="text"
                class="form-control"
                id="searchInput"
                placeholder="Search television...">

            </div>

        </div>

    </section>

    <!-- ================= PRODUCTS ================= -->

    <section
    class="container py-5"
    id="products">

        <h2 class="text-center mb-5">

            Featured Products

        </h2>

        <div
        class="row g-4"
        id="productContainer">

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center py-4">

        <h5>

            Television Shop

        </h5>

        <p>

            Best Smart TV Collection

        </p>

        <p></p>

        </p>

    </footer>

    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="loginForm">
                    <div class="modal-body">

                        <div class="alert alert-danger d-none" id="loginError"></div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ================= REGISTER MODAL ================= -->

    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Sign Up</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="registerForm">
                    <div class="modal-body">

                        <div class="alert alert-danger d-none" id="registerError"></div>

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="regName" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="regPassword" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="regConfirmPassword" required>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Product Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <img id="detailImage" src="" class="img-fluid rounded" alt="">
                        </div>
                        <div class="col-md-6">
                            <span class="badge bg-secondary mb-2" id="detailBrand"></span>
                            <h4 id="detailName"></h4>
                            <p class="text-muted" id="detailDescription"></p>
                            <p class="fw-bold fs-4" id="detailPrice"></p>
                            <button class="btn btn-primary w-100" id="detailAddCart">
                                <i class="fa-solid fa-cart-plus"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-bottom">
 
         
            <div class="social-icons">
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
 
        </div>
 
    </footer>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Product -->

    <script src="products.js"></script>

    <!-- Main -->

    <script src="script.js"></script>

</body>

</html>
