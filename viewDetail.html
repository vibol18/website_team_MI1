<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="viewDetail.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold text-primary" href="index.html">
            Television
        </a>

        <div>

            <a href="cart.html" class="btn btn-outline-primary">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="card shadow-sm border-0 p-4">

        <div class="row align-items-center">

            <div class="col-lg-6 text-center">

                <img
                    id="productImage"
                    src="https://i.pinimg.com/1200x/56/36/65/56366524f3f4d555795e004bc89d4505.jpg"
                    class="img-fluid product-image">

            </div>

            <div class="col-lg-6">

                <h2>Samsung Smart TV 55"</h2>

                <h3 class="text-primary mb-3">$700</h3>

                <p class="text-muted">
                    Experience brilliant 4K UHD resolution,
                    HDR technology and smart streaming.
                </p>

                <div class="mb-3">

                    <label class="form-label">
                        Color
                    </label>

                    <select class="form-select" id="color">

                        <option>Black</option>
                        <option>Gray</option>
                        <option>White</option>

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Quantity
                    </label>

                    <div class="d-flex">

                        <button class="btn btn-primary"
                            id="minus">
                            -
                        </button>

                        <input
                            type="text"
                            id="qty"
                            class="form-control text-center mx-2"
                            value="1"
                            readonly>

                        <button
                            class="btn btn-primary"
                            id="plus">
                            +
                        </button>

                    </div>

                </div>

                <button class="btn btn-primary w-100 mb-2">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Add To Cart

                </button>

                <button class="btn btn-warning w-100">

                    Buy Now

                </button>

            </div>

        </div>

    </div>

</div>

<script src="viewDetail.js"></script>

</body>

</html>
