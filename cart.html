<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="cart.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary" href="index.html">
            Television
        </a>

    </div>

</nav>

<div class="container py-5">

    <h2 class="mb-4">
        <i class="fa-solid fa-cart-shopping"></i>
        Shopping Cart
    </h2>

    <div class="row">

        <!-- Product -->

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <table class="table align-middle">

                        <thead>

                            <tr>

                                <th>Product</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Total</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>

                                <td>

                                    <div class="d-flex align-items-center">

                                        <img
                                            src="https://i.pinimg.com/736x/84/3a/3f/843a3f6df96d4f4010862446dc9a2aa4.jpg"
                                            width="80">

                                        <div class="ms-3">

                                            <h6>Samsung TV</h6>

                                            <small class="text-muted">
                                                Black
                                            </small>

                                        </div>

                                    </div>

                                </td>

                                <td>$700</td>

                                <td>

                                    <div class="d-flex">

                                        <button class="btn btn-primary btn-sm minus">
                                            -
                                        </button>

                                        <input
                                            type="text"
                                            class="form-control text-center qty mx-2"
                                            value="1"
                                            readonly>

                                        <button class="btn btn-primary btn-sm plus">
                                            +
                                        </button>

                                    </div>

                                </td>

                                <td class="item-total">$700</td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Summary -->

        <div class="col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h4>Order Summary</h4>

                    <hr>

                    <div class="d-flex justify-content-between">

                        <span>Subtotal</span>

                        <strong id="subtotal">$700</strong>

                    </div>

                    <div class="d-flex justify-content-between my-3">

                        <span>Shipping</span>

                        <strong>$5</strong>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">

                        <h5>Total</h5>

                        <h5 id="total">$705</h5>

                    </div>

                    <button class="btn btn-success w-100 mt-4">

                        Checkout

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="cart.js"></script>

</body>

</html>
