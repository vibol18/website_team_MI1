<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>

    <link rel="stylesheet" href="viewDetail.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<link rel="stylesheet" href="">
<body>

<div class="container">

    <div class="product-image">
        <img src="https://i.pinimg.com/1200x/66/4c/2e/664c2e8e51df46d44a5f60144b2ab648.jpg" alt="TV">
    </div>

    <div class="product-info">

        <div class="tags">
            <span>#02</span>
            <span>Electronics</span>
        </div>

        <h1>Smart LED TV 55-inch</h1>

        <div class="rating">
            ★★★★★
            <span>4.7 (2,847 reviews)</span>
        </div>

        <div class="price">
            <h2>$499.99</h2>
            <del>$799.99</del>
            <span class="discount">25% OFF</span>
        </div>

        <p class="description">
            4K Ultra HD Smart TV with HDR.
        </p>

        <div class="color-section">
            <h4>Color:</h4>

            <div class="colors">
                <span class="color black active"></span>
                <span class="color white"></span>
                <span class="color blue"></span>
                <span class="color red"></span>
            </div>

            <p id="selectedColor">Black</p>
        </div>

        <div class="quantity">
            <h4>Quantity:</h4>

            <div class="counter">
                <button id="minus">−</button>
                <span id="qty">1</span>
                <button id="plus">+</button>
            </div>
        </div>

        <div class="buttons">
            <button class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
                Add to Cart
            </button>

            <button class="buy">
                Buy Now
            </button>
        </div>

        <div class="features">

            <div class="feature">
                <i class="fa-solid fa-truck"></i>
                <div>
                    <h4>Free Shipping</h4>
                    <p>On orders over $50</p>
                </div>
            </div>

            <div class="feature">
                <i class="fa-solid fa-rotate-left"></i>
                <div>
                    <h4>30-Day Returns</h4>
                    <p>Easy return policy</p>
                </div>
            </div>

            <div class="feature">
                <i class="fa-solid fa-shield-halved"></i>
                <div>
                    <h4>1 Year Warranty</h4>
                    <p>Manufacturer warranty</p>
                </div>
            </div>

            <div class="feature">
                <i class="fa-solid fa-headset"></i>
                <div>
                    <h4>24/7 Support</h4>
                    <p>Customer service</p>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
