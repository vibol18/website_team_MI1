<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart TV Shop</title>
    <link rel="stylesheet" href="viewDetail.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="image-box">
        <img src="https://i.pinimg.com/1200x/56/36/65/56366524f3f4d555795e004bc89d4505.jpg"
        alt="TV">
    </div>

    <div class="details">

        <span class="tag">#02 Electronics</span>

        <h1>Smart LED TV 55-inch</h1>

        <div class="rating">
            ⭐⭐⭐⭐⭐
            <span>4.5 (2,847 reviews)</span>
        </div>

        <div class="price">
            <h2>$599.99</h2>
            <del>$799.99</del>
            <span class="discount">25% OFF</span>
        </div>

        <p class="description">
            4K Ultra HD Smart TV with HDR. Perfect for movies,
            gaming and streaming.
        </p>

        <h3>Color</h3>

<div class="colors">
    <div class="color black active" data-color="Black"></div>
    <div class="color gray" data-color="Gray"></div>
    <div class="color white" data-color="White"></div>
</div>

<p>Selected Color:
    <span id="selectedColor">Black</span>
</p>

        <h3>Quantity</h3>

        <div class="quantity">

            <button id="minus">-</button>

            <span id="qty">0</span>

            <button id="plus">+</button>

        </div>

        <div class="buttons">

            <button class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
                Add to Cart
            </button>

            <button class="buy">
                Buy Now
            </button>

        </div>

        <div class="info">

            <div>
                
                <p>Free Shipping</p>
            </div>

            <div>
                
                <p>30-Day Return</p>
            </div>

            <div>
                
                <p>1 Year Warranty</p>
            </div>

            <div>
                
                <p>24/7 Support</p>
            </div>

        </div>

    </div>

</div>

<script src="viewDetail.js"></script>

</body>
</html>
