<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Television Shop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-wheat rounded-pill mt-2  shadow-sm fixed-top rounded-50">
        <div class="container">

            <a class="navbar-brand fw-bold text-primary" href="#">
                Television
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Offers</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>

                </ul>

                <div class="d-flex gap-2">

                    <a href="cart.html" class="btn btn-outline-dark">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </a>

                    <button class="btn btn-outline-primary">
                        Login
                    </button>

                    <button class="btn btn-primary">
                        Sign Up
                    </button>

                </div>

            </div>

        </div>
    </nav>

    <!-- Hero -->

    <section class="hero">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-lg-6">

                    <h1 class="display-4 fw-bold">
                        Smart TVs For Your Home
                    </h1>

                    <p class="text-muted mt-3">

                        Discover Samsung, Sony and LG Smart TVs with the best
                        prices.

                    </p>

                    <a href="#products" class="btn btn-primary btn-lg">
                        Shop Now
                    </a>

                </div>

                <div class="col-lg-6 text-center">

                    <img src="https://i.pinimg.com/1200x/56/36/65/56366524f3f4d555795e004bc89d4505.jpg"
                        class="img-fluid hero-img">

                </div>

            </div>

        </div>

    </section>

    <!-- Products -->

    <section class="container py-5" id="products">

        <h2 class="text-center mb-5">
            Featured Products
        </h2>

        <div class="row g-4">

            <!-- Product -->

            <div class="col-md-4">

                <div class="card product-card">

                    <img src="https://i.pinimg.com/736x/84/3a/3f/843a3f6df96d4f4010862446dc9a2aa4.jpg"
                        class="card-img-top product-img">

                    <div class="card-body text-center">

                        <h5>Samsung 55" QLED</h5>

                        <h4 class="text-primary">
                            $700
                        </h4>

                        <a href="viewDetail.html" class="btn btn-primary w-100">
                            View Detail
                        </a>

                    </div>

                </div>

            </div>

            <!-- Product -->

            <div class="col-md-4">

                <div class="card product-card">

                    <img src="https://i.pinimg.com/1200x/7a/3d/ee/7a3dee2d5bb0c7c3ad389192a0afa746.jpg"
                        class="card-img-top product-img">

                    <div class="card-body text-center">

                        <h5>LG 65 OLED</h5>

                        <h4 class="text-primary">
                            $650
                        </h4>

                        <a href="viewDetail.html" class="btn btn-primary w-100">
                            View Detail
                        </a>

                    </div>

                </div>

            </div>

            <!-- Product -->

            <div class="col-md-4">

                <div class="card product-card">

                    <img src="https://i.pinimg.com/736x/e8/e4/18/e8e41832520adfefab9cd2c0d8ecca64.jpg"
                        class="card-img-top product-img">

                    <div class="card-body text-center">

                        <h5>Sony Bravia 50"</h5>

                        <h4 class="text-primary">
                            $500
                        </h4>

                        <a href="viewDetail.html" class="btn btn-primary w-100">
                            View Detail
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Footer -->

    <footer class="bg-dark text-white text-center py-3">
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
<script src="./script.js"></script>

</html>
